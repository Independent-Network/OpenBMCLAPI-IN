name: Build, Package and Release

on:
  push:
    branches: [main, dev]
    tags:
      - "v*" # 匹配版本号tag，如v1.0.0
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: "Release"
  DOCKER_REGISTRY: "ghcr.io"
  PROJECT_NAME: "OpenBMCLAPI-IN"

jobs:
  build-and-package:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 平台
          - os: ubuntu-latest
            arch: x64
            rid: linux-x64
          - os: ubuntu-latest
            arch: arm
            rid: linux-arm
          - os: ubuntu-latest
            arch: arm64
            rid: linux-arm64
          # Windows 平台
          - os: windows-latest
            arch: x64
            rid: win-x64
          - os: windows-latest
            arch: x86
            rid: win-x86
          - os: windows-latest
            arch: arm64
            rid: win-arm64
          # macOS 平台
          - os: macos-latest
            arch: x64
            rid: osx-x64
          - os: macos-latest
            arch: arm64
            rid: osx-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Commit SHA
        id: commit
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Application (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          dotnet publish \
            --configuration ${{ env.CONFIGURATION }} \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --output ./publish/${{ matrix.rid }} \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true

      - name: Publish Application (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          dotnet publish ^
            --configuration ${{ env.CONFIGURATION }} ^
            --runtime ${{ matrix.rid }} ^
            --self-contained true ^
            --output ./publish/${{ matrix.rid }} ^
            -p:PublishSingleFile=true ^
            -p:PublishTrimmed=true

      - name: Package Artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p ./artifacts
          FILENAME_PREFIX="${{ env.PROJECT_NAME }}_${{ steps.commit.outputs.sha_short }}_${{ matrix.rid }}"
          tar -czvf "./artifacts/${FILENAME_PREFIX}.tar.gz" -C "./publish/${{ matrix.rid }}" .

          if [[ "${{ matrix.rid }}" == "linux-x64" ]]; then
            sudo apt-get update
            sudo apt-get install -y rpm ruby ruby-dev rubygems build-essential
            sudo gem install --no-document fpm
            
            fpm -s dir -t deb -n ${{ env.PROJECT_NAME }} \
              -v ${{ github.run_number }} \
              --architecture amd64 \
              --prefix /usr/local/${{ env.PROJECT_NAME }} \
              -C "./publish/${{ matrix.rid }}" \
              -p "./artifacts/${FILENAME_PREFIX}.deb"
            
            fpm -s dir -t rpm -n ${{ env.PROJECT_NAME }} \
              -v ${{ github.run_number }} \
              --architecture x86_64 \
              --prefix /usr/local/${{ env.PROJECT_NAME }} \
              -C "./publish/${{ matrix.rid }}" \
              -p "./artifacts/${FILENAME_PREFIX}.rpm"
          fi

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $commitShort = "${{ steps.commit.outputs.sha_short }}"
          $rid = "${{ matrix.rid }}"
          $projectName = "${{ env.PROJECT_NAME }}"

          New-Item -ItemType Directory -Path ./artifacts -Force
          $zipName = "$projectName`_$commitShort`_$rid.zip"

          Compress-Archive -Path "./publish/$rid/*" -DestinationPath "./artifacts/$zipName" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_${{ steps.commit.outputs.sha_short }}_${{ matrix.rid }}_packages
          path: ./artifacts/${{ env.PROJECT_NAME }}_${{ steps.commit.outputs.sha_short }}_${{ matrix.rid }}.*
          retention-days: 7

  create-release:
    name: Create Release
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: previous-tag
        run: |
          # 获取当前tag
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          # 获取上一个tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$CURRENT_TAG"^ 2>/dev/null || echo "")
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          if [ -z "${{ steps.previous-tag.outputs.previous-tag }}" ]; then
            # 如果没有上一个tag，获取所有commit
            CHANGELOG=$(git log --pretty=format:"- %s (%h)")
          else
            # 获取两个tag之间的commit
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${{ steps.previous-tag.outputs.previous-tag }}".."${{ github.ref }}")
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: OpenBMCLAPI-IN Release ${{ github.ref_name }}
          body: |
            ### Changelog
            ${{ steps.changelog.outputs.changelog }}
          files: |
            artifacts/*
          draft: false
          prerelease: false
